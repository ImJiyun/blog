steps:
  - name: "node:20-slim"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        apt-get update -y && apt-get install -y openssl
        npm ci
        npx prisma migrate deploy
    secretEnv: ["DATABASE_URL"]

  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=$_GA_MEASUREMENT_ID
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=$_SITE_URL
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog:$SHORT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog:latest
      - .

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog
      - --all-tags

  # Guards against a race where two commits land on main close together:
  # both builds finish around the same time, and whichever's deploy step
  # runs last wins — even if it's for the older commit. If a newer build
  # from this same trigger already exists by the time we're ready to
  # deploy, skip and let that build's deploy own the final state instead.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        MY_CREATE_TIME=$$(gcloud builds describe $BUILD_ID --region=us-central1 --format="value(createTime)")
        FILTER='substitutions.TRIGGER_NAME="$TRIGGER_NAME" AND createTime>"'"$$MY_CREATE_TIME"'"'
        NEWER_BUILD=$$(gcloud builds list --region=us-central1 --filter="$$FILTER" --format="value(id)" --limit=1)
        if [ -n "$$NEWER_BUILD" ]; then
          echo "Skipping deploy: newer build $$NEWER_BUILD for main already exists, it will deploy the latest commit instead."
          exit 0
        fi
        gcloud run deploy blog \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog:$SHORT_SHA \
          --region=us-central1 \
          --platform=managed

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog:latest

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: "DATABASE_URL"

substitutions:
  # Not a secret — this ID is embedded in every page's HTML — so a plain
  # substitution is enough; no Secret Manager entry needed. Override at the
  # Cloud Build trigger level if it ever needs to change without a commit.
  _GA_MEASUREMENT_ID: "G-X7LYQMZBMB"
  # Passed as --build-arg, not --update-env-vars — NEXT_PUBLIC_* vars are
  # inlined at build time, so setting this on the deployed service afterward
  # would be a no-op (see the Dockerfile comment above NEXT_PUBLIC_GA_MEASUREMENT_ID).
  _SITE_URL: "https://hanul.dev"
