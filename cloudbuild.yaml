steps:
  - name: "node:20-slim"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        apt-get update -y && apt-get install -y openssl
        npm ci
        npx prisma migrate deploy
    secretEnv: ["DATABASE_URL"]

  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=$_GA_MEASUREMENT_ID
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog:$SHORT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog:latest
      - .

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog
      - --all-tags

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - blog
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --update-env-vars=NEXT_PUBLIC_SITE_URL=$_SITE_URL

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/blog/blog:latest

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: "DATABASE_URL"

substitutions:
  # Not a secret — this ID is embedded in every page's HTML — so a plain
  # substitution is enough; no Secret Manager entry needed. Override at the
  # Cloud Build trigger level if it ever needs to change without a commit.
  _GA_MEASUREMENT_ID: "G-X7LYQMZBMB"
  # --update-env-vars only touches this key, leaving the secret-backed env vars
  # (DATABASE_URL, JWT_SECRET, ADMIN_PASSWORD_HASH) untouched.
  _SITE_URL: "https://hanul.dev"
